# Identity platform (STS, Admin API, Admin Web) on SQL Server 2022. See docs/handoffs/TASK-018.
#
#   docker compose -f docker-compose.identity.yml up -d --build
#   docker compose -f docker-compose.identity.yml ps
#   docker compose -f docker-compose.identity.yml down          # keeps the volumes (database, keys)
#   docker compose -f docker-compose.identity.yml down -v       # also deletes them
#
# Host ports: STS 5001, Admin API 5002, Admin Web 5000, SQL Server 1433, PostgreSQL (LinguaBridge) 5432.
# The LinguaBridge API itself is not part of this file: run it on the host (dotnet run) against the database below and the STS.
# SQL Server, Admin API, Admin Web and PostgreSQL are published on the loopback address only, so other machines on the network cannot
# reach them (the database has a known sa password). Set IDENTITY_BIND_ADDRESS=0.0.0.0 to open them on purpose.
# The STS is the exception and is open to the network, see its comment below.
# Every value below that looks like ${NAME:-default} can be overridden from the shell or a .env file.
# These defaults are for local development only: change every secret before exposing this anywhere.
name: appinhouse-identity

x-identity-environment: &identity-environment
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__IdentityDb: "Server=identity-db,1433;Database=AppInHouse_Identity;User Id=sa;Password=${SA_PASSWORD:-Abc@1234Password!};TrustServerCertificate=True;MultipleActiveResultSets=true"

# One address for the STS that works from the browser AND from the containers. A token's issuer must be the same text
# for whoever asks for it, whoever validates it, and the browser that is redirected to it; "localhost" would mean the
# container itself to the other services. Docker Desktop resolves host.docker.internal on the host and in containers
# (extra_hosts below does the same on Linux), and the STS is reached through its published port 5001.
x-sts-authority: &sts-authority ${IDENTITY_AUTHORITY:-http://host.docker.internal:5001}

x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  identity-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: identity-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Abc@1234Password!}
    ports:
      # The host side is configurable because a SQL Server installed on the host usually owns 1433 already.
      - "${IDENTITY_BIND_ADDRESS:-127.0.0.1}:${IDENTITY_DB_PORT:-1433}:1433"
    volumes:
      - identity-db-data:/var/opt/mssql
    healthcheck:
      # sqlcmd 18 encrypts by default; -C trusts the container's self-signed certificate.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [identity-network]

  # The LinguaBridge database. The LinguaBridge API runs on the host and connects to localhost:5432 (appsettings.Development.json);
  # create or update its tables with: dotnet ef database update (see docs/handoffs/TASK-020).
  linguabridge-db:
    image: postgres:16-alpine
    container_name: linguabridge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-LinguaBridge}
    ports:
      # Loopback only, like the other databases; a PostgreSQL installed on the host may own 5432 (see LINGUABRIDGE_DB_PORT).
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${LINGUABRIDGE_DB_PORT:-5432}:5432"
    volumes:
      - linguabridge-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [identity-network]

  # A new named volume belongs to root, but the services run as the unprivileged "app" user (uid 1654) and could not
  # write their keys into it. This one-shot container hands the volumes over, then exits.
  identity-volume-init:
    image: busybox:1.36
    container_name: identity-volume-init
    user: root
    command: ["sh", "-c", "chown -R 1654:1654 /dataprotection-keys /sts-certificates"]
    volumes:
      - identity-dataprotection-keys:/dataprotection-keys
      - identity-sts-certificates:/sts-certificates
    restart: "no"
    networks: [identity-network]

  identity-sts:
    build:
      context: ./repos/identity
      dockerfile: src/Presentation/AppInHouse.Identity.STS/Dockerfile
    image: appinhouse-identity-sts:local
    container_name: identity-sts
    restart: unless-stopped
    environment:
      <<: *identity-environment
      # In Development the STS migrates and seeds the database before it starts listening, so "port open" means "ready".
      Database__MigrateOnStartup: "true"
      Seeding__Enabled: "true"
      Seeding__AdminPassword: ${ADMIN_PASSWORD:-Admin@AppInHouse123!}
      Seeding__AdminApiClientSecret: ${ADMIN_API_CLIENT_SECRET:-dev-identity-admin-api-secret-change-me}
      # The learners' app client (linguabridge-app, Authorization Code + PKCE). The LinguaBridge API's own secret and scope
      # come from the STS's appsettings.Development.json.
      Seeding__LinguaBridgeAppEnabled: "true"
      # The portal's redirect addresses: the Docker one first, then the ones used when running outside Docker.
      Seeding__AdminPortalRedirectUris__0: ${ADMIN_WEB_URL:-http://localhost:5000}/signin-oidc
      Seeding__AdminPortalRedirectUris__1: https://localhost:44303/signin-oidc
      Seeding__AdminPortalPostLogoutRedirectUris__0: ${ADMIN_WEB_URL:-http://localhost:5000}/signout-callback-oidc
      Seeding__AdminPortalPostLogoutRedirectUris__1: https://localhost:44303/signout-callback-oidc
    ports:
      # Deliberately NOT limited to loopback. host.docker.internal resolves to the host's own network address, not to
      # 127.0.0.1, so a loopback-only port would not be reachable by name, from the containers or from the browser.
      # Consequence: anyone on the same network can reach the STS login page, where the seeded admin account
      # (admin@appinhouse.local) has a password that is public in this repository. Use only on a trusted network, or
      # change Seeding__AdminPassword, until the STS issuer can be fixed in its configuration.
      - "5001:8080"
    volumes:
      - identity-dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
      # The development signing/encryption certificates live in the user's certificate store; keeping it means tokens
      # and sessions issued before a container is recreated stay valid.
      - identity-sts-certificates:/home/app/.dotnet/corefx/cryptography
    depends_on:
      identity-db:
        condition: service_healthy
      identity-volume-init:
        condition: service_completed_successfully
    extra_hosts: *host-gateway
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    networks: [identity-network]

  identity-admin-api:
    build:
      context: ./repos/identity
      dockerfile: src/Presentation/AppInHouse.Identity.Admin.Api/Dockerfile
    image: appinhouse-identity-admin-api:local
    container_name: identity-admin-api
    restart: unless-stopped
    environment:
      <<: *identity-environment
      # Access tokens are checked by asking the STS (introspection) as the identity_admin_api client.
      Authentication__Authority: *sts-authority
      Authentication__ClientId: identity_admin_api
      Authentication__ClientSecret: ${ADMIN_API_CLIENT_SECRET:-dev-identity-admin-api-secret-change-me}
    ports:
      - "${IDENTITY_BIND_ADDRESS:-127.0.0.1}:5002:8080"
    volumes:
      - identity-dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      identity-db:
        condition: service_healthy
      identity-volume-init:
        condition: service_completed_successfully
      identity-sts:
        condition: service_healthy
    extra_hosts: *host-gateway
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [identity-network]

  identity-admin-web:
    build:
      context: ./repos/identity
      dockerfile: src/Presentation/AppInHouse.Identity.Admin.Web/Dockerfile
    image: appinhouse-identity-admin-web:local
    container_name: identity-admin-web
    restart: unless-stopped
    environment:
      <<: *identity-environment
      # The STS owns the schema. Admin Web would otherwise migrate it too in Development, at the same moment.
      Database__MigrateOnStartup: "false"
      Authentication__Authority: *sts-authority
      Authentication__ClientId: admin-portal
    ports:
      - "${IDENTITY_BIND_ADDRESS:-127.0.0.1}:5000:8080"
    volumes:
      - identity-dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      identity-db:
        condition: service_healthy
      identity-volume-init:
        condition: service_completed_successfully
      identity-sts:
        condition: service_healthy
      identity-admin-api:
        condition: service_healthy
    extra_hosts: *host-gateway
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [identity-network]

networks:
  identity-network:
    driver: bridge

volumes:
  linguabridge-db-data:
  identity-db-data:
  identity-dataprotection-keys:
  identity-sts-certificates:
