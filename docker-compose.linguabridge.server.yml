# LinguaBridge API on a shared Linux server, next to the identity stack. Use with docker-compose.identity.yml
# (it provides linguabridge-db and the STS) and docker-compose.identity.server.yml:
#
#   docker compose -f docker-compose.identity.yml -f docker-compose.identity.server.yml -f docker-compose.linguabridge.server.yml \
#       --env-file .env up -d --build identity-sts identity-admin-api identity-admin-web linguabridge-db linguabridge-api
#
# Required in .env: IDENTITY_AUTHORITY (http://<server-ip>:5001), the same value the STS issues tokens with.
# The API creates its tables on start (Database__MigrateOnStartup). PostgreSQL stays on the loopback address.
# Load the sample courses afterwards: psql -U postgres -d LinguaBridge -f scripts/seed-sample-courses.sql (see the script).
services:
  linguabridge-api:
    build:
      context: ./repos/linguabridge
      dockerfile: src/Presentation/LinguaBridge.Api/Dockerfile
    image: appinhouse-linguabridge-api:local
    container_name: linguabridge-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LinguaBridgeDb: "Host=linguabridge-db;Port=5432;Database=${POSTGRES_DB:-LinguaBridge};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Authentication__Authority: ${IDENTITY_AUTHORITY:-http://host.docker.internal:5001}
      Database__MigrateOnStartup: "true"
    ports:
      - "5020:8080"
    depends_on:
      linguabridge-db:
        condition: service_healthy
      identity-sts:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks: [identity-network]
