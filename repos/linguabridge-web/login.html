<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.login">Đăng nhập - LinguaBridge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2712.5%27 font-size=%2713%27%3E%F0%9F%8C%90%3C/text%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body data-page="login">
  <div id="navbar"></div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">
        <!-- "Bạn đã đăng xuất thành công" when the address has ?loggedOut=1 -->
        <div id="logout-alert"></div>
        <div class="card lb-card shadow-sm border-0">
          <div class="card-body p-4 p-md-5 text-center">
            <div class="mb-3"><i class="bi bi-translate fs-1 text-primary"></i></div>
            <h1 class="h4 card-title fw-bold mb-2" data-i18n="login.heading">Đăng Nhập LinguaBridge</h1>
            <p class="text-secondary small mb-4" data-i18n="login.desc">Học tiếng Anh &amp; tiếng Trung giao tiếp thông minh cùng AI Tutor và Flashcard SRS.</p>
            <button id="btn-login-oidc" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-box-arrow-in-right me-2"></i><span data-i18n="login.button">Đăng Nhập Bằng AppInHouse ID</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
