<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.courses">Khóa học - LinguaBridge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2712.5%27 font-size=%2713%27%3E%F0%9F%8C%90%3C/text%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body data-page="courses">
  <div id="navbar"></div>

  <main class="container py-4" id="content">
    <h1 class="h3 mb-3" data-i18n="courses.title">Khám phá khóa học</h1>
    <ul class="nav nav-pills mb-4" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-target="en" type="button"><i class="bi bi-alphabet me-1"></i><span data-i18n="lang.en">Tiếng Anh</span></button></li>
      <li class="nav-item"><button class="nav-link" data-target="zh" type="button"><i class="bi bi-translate me-1"></i><span data-i18n="lang.zh">Tiếng Trung</span></button></li>
    </ul>
    <div id="courses-error"></div>
    <div class="row g-4" id="courses"></div>
  </main>

  <div class="modal fade" id="lessons-modal" tabindex="-1" aria-labelledby="lessons-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="lessons-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" data-i18n-attr="aria-label:common.close" aria-label="Đóng"></button>
        </div>
        <div class="modal-body" id="lessons-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
