<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.flashcards">Ôn tập từ vựng - LinguaBridge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2712.5%27 font-size=%2713%27%3E%F0%9F%8C%90%3C/text%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body data-page="flashcards">
  <div id="navbar"></div>

  <main class="container py-4" id="content">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0" data-i18n="flash.title">Ôn tập từ vựng</h1>
      <div class="d-flex gap-2">
        <select id="language-filter" class="form-select form-select-sm w-auto" data-i18n-attr="aria-label:flash.filter" aria-label="Ngôn ngữ cần ôn">
          <option value="" data-i18n="flash.filterAll">Tất cả ngôn ngữ</option>
          <option value="en" data-i18n="lang.en">Tiếng Anh</option>
          <option value="zh" data-i18n="lang.zh">Tiếng Trung</option>
        </select>
        <button id="reload" class="btn btn-sm btn-outline-secondary" data-i18n-attr="title:flash.reload;aria-label:flash.reload" title="Tải lại"><i class="bi bi-arrow-clockwise"></i></button>
      </div>
    </div>

    <div id="flash-error"></div>
    <div id="loading" class="text-center text-secondary py-5"><div class="spinner-border" role="status"></div><div class="mt-2" data-i18n="flash.loading">Đang tải thẻ...</div></div>

    <div id="stage" class="d-none">
      <div id="empty" class="text-center py-5 d-none">
        <i class="bi bi-emoji-smile fs-1 text-success"></i>
        <h2 class="h4 mt-2" data-i18n="flash.emptyTitle">Hôm nay không còn thẻ nào cần ôn</h2>
        <p class="text-secondary" data-i18n="flash.emptyDesc">Hãy hoàn thành thêm bài học để thêm từ vựng mới.</p>
        <a href="/courses.html" class="btn btn-primary" data-i18n="flash.toCourses">Đến khóa học</a>
      </div>

      <div id="done" class="text-center py-5 d-none">
        <i class="bi bi-trophy-fill fs-1 text-warning"></i>
        <h2 class="h4 mt-2" data-i18n="flash.doneTitle">Hoàn thành lượt ôn tập!</h2>
        <p class="text-secondary" id="done-text"></p>
        <button class="btn btn-primary" onclick="document.getElementById('reload').click()" data-i18n="flash.again">Ôn tiếp</button>
      </div>

      <div id="deck" class="d-none">
        <div class="d-flex align-items-center gap-3 mb-4 scene">
          <div class="progress deck-progress flex-grow-1" role="progressbar" data-i18n-attr="aria-label:flash.deckAria" aria-label="Tiến độ lượt ôn"><div class="progress-bar" id="deck-bar" style="width:0"></div></div>
          <span class="small text-secondary" id="deck-position"></span>
        </div>

        <div class="scene">
          <div class="flashcard" id="flashcard" tabindex="0" role="button" data-i18n-attr="aria-label:flash.cardAria" aria-label="Lật thẻ (Space)">
            <div class="flashcard-face flashcard-front">
              <span class="badge text-bg-light border mb-3" id="front-meta"></span>
              <div class="card-word" id="front-text"></div>
            </div>
            <div class="flashcard-face flashcard-back">
              <div class="card-ipa mb-2" id="back-ipa"></div>
              <div class="card-meaning" id="back-meaning"></div>
              <div class="small mt-3 opacity-75" id="back-state"></div>
            </div>
          </div>
        </div>

        <p class="text-center text-secondary small mt-3" id="flip-hint"><i class="bi bi-hand-index me-1"></i><span data-i18n="flash.hintPrefix">Chạm vào thẻ hoặc nhấn</span> <kbd>Space</kbd> <span data-i18n="flash.hintSuffix">để lật</span></p>
        <div class="row g-2 mt-2 scene invisible" id="rating-row"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
