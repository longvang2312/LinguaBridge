<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.lesson">Làm bài học - LinguaBridge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2712.5%27 font-size=%2713%27%3E%F0%9F%8C%90%3C/text%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body data-page="lesson">
  <!-- Focus layout: no site navbar, only what the lesson needs. The language is chosen before the lesson starts
       (switching reloads the page, which would throw the attempt away). -->
  <header class="lesson-topbar">
    <div class="container quiz-wrap d-flex align-items-center gap-2 gap-sm-3 py-2">
      <button id="exit-button" class="btn btn-link text-secondary fs-4 p-0" type="button" data-i18n-attr="aria-label:quiz.exit;title:quiz.exit" aria-label="Thoát bài học">
        <i class="bi bi-x-lg"></i>
      </button>
      <div class="progress quiz-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar quiz-progress-fill" id="quiz-bar" style="width:0"></div>
      </div>
      <div class="text-end small lh-sm flex-shrink-0">
        <div class="fw-semibold" id="quiz-position"></div>
        <div class="text-warning-emphasis"><i class="bi bi-lightning-charge-fill text-warning"></i> <span id="quiz-xp"></span></div>
      </div>
    </div>
  </header>

  <main class="container quiz-wrap py-4">
    <div id="quiz-loading" class="text-center text-secondary py-5">
      <div class="spinner-border" role="status"></div>
      <div class="mt-2" data-i18n="quiz.preparing">Đang chuẩn bị bài học...</div>
    </div>
    <div id="quiz-error"></div>
    <section id="quiz-question" class="d-none" aria-live="polite"></section>
    <section id="quiz-complete" class="quiz-complete d-none"></section>
  </main>

  <!-- Result of the answer and the Check / Continue button; outside <main> so its page animation cannot affect position:fixed. -->
  <footer id="answer-bar" class="answer-bar d-none">
    <div class="container quiz-wrap">
      <div id="feedback" class="feedback d-none mb-3" role="status" aria-live="assertive"></div>
      <button id="check-button" class="btn btn-primary btn-lg w-100 fw-semibold" type="button" disabled data-i18n="quiz.check">Kiểm tra</button>
    </div>
  </footer>

  <div class="modal fade" id="exit-modal" tabindex="-1" aria-labelledby="exit-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center p-4">
          <i class="bi bi-exclamation-circle fs-1 text-warning"></i>
          <h2 class="h5 mt-2" id="exit-title" data-i18n="quiz.exitTitle">Thoát bài học?</h2>
          <p class="text-secondary" data-i18n="quiz.exitDesc">Lượt làm bài này sẽ bị hủy và bạn sẽ không nhận được XP.</p>
          <div class="d-grid gap-2">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal" data-i18n="quiz.exitStay">Ở lại học tiếp</button>
            <button type="button" class="btn btn-outline-danger" id="exit-confirm" data-i18n="quiz.exitLeave">Thoát</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
