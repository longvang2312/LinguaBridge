# Override for deploying the identity stack on a shared Linux server (used with docker-compose.identity.yml):
#
#   docker compose -f docker-compose.identity.yml -f docker-compose.identity.server.yml --env-file .env up -d --build \
#       identity-sts identity-admin-api identity-admin-web
#
# Required in .env: IDENTITY_AUTHORITY (http://<server-ip>:5001), ADMIN_WEB_URL (http://<server-ip>:5000),
# SA_PASSWORD, ADMIN_PASSWORD, ADMIN_API_CLIENT_SECRET.
# SQL Server (1433) and the Admin API (5002) stay on the loopback address; only the STS (5001) and the Admin Web (5000) are open.
#
# LINGUABRIDGE_WEB_URL (default http://localhost:3000) is where the web client is served; the STS registers its sign-in and
# sign-out addresses for the "linguabridge-app" client (added to an existing database on the next STS start, nothing removed).
# SHARED_SERVICES_WEB_URL (default http://localhost:5031) is where the Shared Services portal is served; the same goes for its
# "shared-services-portal" client.
services:
  identity-sts:
    environment:
      Seeding__LinguaBridgeAppRedirectUris__0: ${LINGUABRIDGE_WEB_URL:-http://localhost:3000}/callback
      Seeding__LinguaBridgeAppRedirectUris__1: http://localhost:3000/callback
      Seeding__LinguaBridgeAppRedirectUris__2: http://localhost:5173/callback
      Seeding__LinguaBridgeAppPostLogoutRedirectUris__0: ${LINGUABRIDGE_WEB_URL:-http://localhost:3000}/login.html
      Seeding__LinguaBridgeAppPostLogoutRedirectUris__1: ${LINGUABRIDGE_WEB_URL:-http://localhost:3000}/callback
      Seeding__LinguaBridgeAppPostLogoutRedirectUris__2: http://localhost:3000/login.html
      Seeding__LinguaBridgeAppPostLogoutRedirectUris__3: http://localhost:3000/callback
      Seeding__LinguaBridgeAppPostLogoutRedirectUris__4: http://localhost:5173/login.html
      Seeding__SharedServicesPortalRedirectUris__0: ${SHARED_SERVICES_WEB_URL:-http://localhost:5031}/signin-oidc
      Seeding__SharedServicesPortalRedirectUris__1: http://localhost:5031/signin-oidc
      Seeding__SharedServicesPortalPostLogoutRedirectUris__0: ${SHARED_SERVICES_WEB_URL:-http://localhost:5031}/signout-callback-oidc
      Seeding__SharedServicesPortalPostLogoutRedirectUris__1: http://localhost:5031/signout-callback-oidc

  identity-admin-web:
    ports: !override
      - "0.0.0.0:5000:8080"
