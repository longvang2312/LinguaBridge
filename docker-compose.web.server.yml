# The LinguaBridge web client on a shared Linux server (used with docker-compose.identity.yml and the two other server files):
#
#   docker compose -f docker-compose.identity.yml -f docker-compose.identity.server.yml -f docker-compose.linguabridge.server.yml \
#       -f docker-compose.web.server.yml --env-file .env up -d --build
#
# Required in .env: IDENTITY_AUTHORITY (http://<server-ip>:5001) and LINGUABRIDGE_WEB_URL (http://<server-ip>:3000).
# The browser talks to this host only (same origin): /sts/* goes to the STS and /lb/* to the LinguaBridge API.
# The STS is reached through the address in IDENTITY_AUTHORITY, so the token endpoint sees the host name the tokens are issued for.
services:
  linguabridge-web:
    build:
      context: ./repos/linguabridge-web
      dockerfile: LinguaBridge.Web.Host/Dockerfile
    image: appinhouse-linguabridge-web:local
    container_name: linguabridge-web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Web__StsUrl: ${IDENTITY_AUTHORITY:?set IDENTITY_AUTHORITY in .env}
      Web__ApiUrl: http://linguabridge-api:8080
    ports:
      - "3000:3000"
    depends_on:
      linguabridge-api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3000; printf \"GET /index.html HTTP/1.0\r\nHost: localhost\r\n\r\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [identity-network]
